name: Deploy Frontend

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  CONTAINER_NAME: freelance-pvprotech-frontend-container
  CONTAINER_PORT: 5173

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------
      # 3. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 4. Set image variables
      # --------------------------------------------------
      - name: Set image variables
        id: image
        run: |
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 5. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            .

      # --------------------------------------------------
      # 6. Push Docker image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # --------------------------------------------------
      # 7. Pull image from ECR
      # --------------------------------------------------
      - name: Pull Docker image
        run: |
          docker pull \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # --------------------------------------------------
      # 8. Stop existing container
      # --------------------------------------------------
      - name: Stop existing container
        run: |
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

      # --------------------------------------------------
      # 9. Start new container
      # --------------------------------------------------
      - name: Start frontend container
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            -p 127.0.0.1:5173:5173 \
            --restart unless-stopped \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # --------------------------------------------------
      # 10. Wait for application
      # --------------------------------------------------
      - name: Wait for application
        run: |
          echo "Waiting for frontend to start..."
          sleep 5

      # --------------------------------------------------
      # 11. Check container
      # --------------------------------------------------
      - name: Check container
        run: |
          if ! docker ps \
            --filter "name=$CONTAINER_NAME" \
            --filter "status=running" \
            | grep -q "$CONTAINER_NAME"; then

            echo "Frontend container failed to start."
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

      # --------------------------------------------------
      # 12. Health check
      # --------------------------------------------------
      - name: Health check
        run: |
          if ! curl -f http://127.0.0.1:5173; then
            echo "Frontend health check failed."
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

      # --------------------------------------------------
      # 13. Cleanup old Docker images
      # --------------------------------------------------
      - name: Cleanup Docker images
        run: |
          docker image prune -af

      # --------------------------------------------------
      # 14. Final status
      # --------------------------------------------------
      - name: Deployment successful
        run: |
          echo "========================================="
          echo "Frontend deployment completed successfully"
          echo "========================================="

          docker ps --filter "name=$CONTAINER_NAME"
