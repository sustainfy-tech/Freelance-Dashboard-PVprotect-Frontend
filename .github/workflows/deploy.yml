name: Deploy Frontend

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  CONTAINER_NAME: freelance-pvprotech-frontend-container

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Configure AWS credentials
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ============================================================
      # 3. Login to Amazon ECR
      # ============================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================================
      # 4. Set image variables
      # ============================================================
      - name: Set image variables
        id: image
        run: |
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. Verify frontend API URL secret exists
      # ============================================================
      - name: Verify frontend environment
        env:
          VITE_APP_SERVER_BASE_URL: ${{ secrets.VITE_APP_SERVER_BASE_URL }}
        run: |
          if [ -z "$VITE_APP_SERVER_BASE_URL" ]; then
            echo "ERROR: VITE_APP_SERVER_BASE_URL GitHub Secret is not configured."
            exit 1
          fi

          echo "VITE_APP_SERVER_BASE_URL is configured."

      # ============================================================
      # 6. Build Docker image
      # ============================================================
      - name: Build Docker image
        env:
          VITE_APP_SERVER_BASE_URL: ${{ secrets.VITE_APP_SERVER_BASE_URL }}
        run: |
          docker build \
            --build-arg VITE_APP_SERVER_BASE_URL="$VITE_APP_SERVER_BASE_URL" \
            -t ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            .

      # ============================================================
      # 7. Push image to ECR
      # ============================================================
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # ============================================================
      # 8. Pull image from ECR
      # ============================================================
      - name: Pull Docker image
        run: |
          docker pull \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # ============================================================
      # 9. Stop existing container
      # ============================================================
      - name: Stop existing container
        run: |
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

      # ============================================================
      # 10. Start new container
      # ============================================================
      - name: Start frontend container
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            -p 127.0.0.1:5173:3000 \
            --restart unless-stopped \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # ============================================================
      # 11. Wait for application
      # ============================================================
      - name: Wait for application
        run: |
          echo "Waiting for frontend to start.."
          sleep 5

      # ============================================================
      # 12. Check container
      # ============================================================
      - name: Check container
        run: |
          if ! docker ps \
            --filter "name=$CONTAINER_NAME" \
            --filter "status=running" \
            | grep -q "$CONTAINER_NAME"; then

            echo "Frontend container failed to start."

            docker logs "$CONTAINER_NAME" || true

            exit 1
          fi

          echo "Frontend container is running."

      # ============================================================
      # 13. Health check
      # ============================================================
      - name: Health check
        run: |
          echo "Checking frontend..."

          if ! curl -f http://localhost:5173; then
            echo "Frontend health check failed."

            docker logs "$CONTAINER_NAME" || true

            exit 1
          fi

          echo "Frontend health check passed."

      # ============================================================
      # 14. Cleanup unused Docker images
      # ============================================================
      - name: Cleanup Docker images
        run: |
          docker image prune -af

      # ============================================================
      # 15. Final status
      # ============================================================
      - name: Deployment successful
        run: |
          echo "========================================="
          echo "Frontend deployment completed successfully"
          echo "========================================="

          docker ps --filter "name=$CONTAINER_NAME"
